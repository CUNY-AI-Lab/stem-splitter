[project]
name = "stem-splitter-instrument-discovery"
version = "0.1.0"
description = "Private advisory CLAP instrument discovery service for STEM Splitter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub==0.36.2",
  "numpy==2.5.2",
  "scipy==1.18.0",
  "torch==2.13.0",
  "transformers==4.57.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

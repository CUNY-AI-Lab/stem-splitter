name: YAMNet comparator image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/yamnet-comparator-image.yml
      - audio-analysis/config.ts
      - audio-analysis/decoder.ts
      - audio-analysis/discovery.ts
      - audio-analysis/process.ts
      - docs/acceptance/2026-08-09-yamnet-comparator/native-arm64-controls.json
      - instrument-discovery/vocabulary.json
      - bun.lock
      - package.json
      - tsconfig.json
      - scripts/eval-instrument-discovery.mts
      - scripts/hydrate-instrument-evaluation-corpus.mts
      - scripts/hydrate-instrument-controls.mts
      - scripts/eval-yamnet-comparator.mts
      - scripts/eval-yamnet-controls.mts
      - scripts/capture-yamnet-instrument-candidate.mts
      - scripts/prepare-yamnet-candidate-source.mts
      - scripts/lib/instrument-control-corpus.mts
      - scripts/lib/instrument-evaluation.mts
      - scripts/lib/yamnet-candidate-capture.mts
      - scripts/run-yamnet-comparator-eval.sh
      - scripts/smoke-yamnet-comparator-image.mts
      - src/analysis/instrument-vocabulary.ts
      - src/analysis/types.ts
      - tests/corpus/corpus.json
      - tests/corpus/instrument-evaluation-corpus-hydration.json
      - tests/corpus/instrument-discovery-expectations.json
      - tests/corpus/instrument-control-manifest.json
      - tests/corpus/instrument-evaluation-plan.json
      - tests/instrument-control-corpus.test.mts
      - tests/instrument-evaluation-corpus-hydration.test.mts
      - tests/yamnet-candidate-capture.test.mts
      - tests/yamnet-comparator-eval.test.mts
      - tsconfig.instrument-evaluation.json
      - yamnet-comparator/**
  pull_request:
    paths:
      - .github/workflows/yamnet-comparator-image.yml
      - audio-analysis/config.ts
      - audio-analysis/decoder.ts
      - audio-analysis/discovery.ts
      - audio-analysis/process.ts
      - docs/acceptance/2026-08-09-yamnet-comparator/native-arm64-controls.json
      - instrument-discovery/vocabulary.json
      - bun.lock
      - package.json
      - tsconfig.json
      - scripts/eval-instrument-discovery.mts
      - scripts/hydrate-instrument-evaluation-corpus.mts
      - scripts/hydrate-instrument-controls.mts
      - scripts/eval-yamnet-comparator.mts
      - scripts/eval-yamnet-controls.mts
      - scripts/capture-yamnet-instrument-candidate.mts
      - scripts/prepare-yamnet-candidate-source.mts
      - scripts/lib/instrument-control-corpus.mts
      - scripts/lib/instrument-evaluation.mts
      - scripts/lib/yamnet-candidate-capture.mts
      - scripts/run-yamnet-comparator-eval.sh
      - scripts/smoke-yamnet-comparator-image.mts
      - src/analysis/instrument-vocabulary.ts
      - src/analysis/types.ts
      - tests/corpus/corpus.json
      - tests/corpus/instrument-evaluation-corpus-hydration.json
      - tests/corpus/instrument-discovery-expectations.json
      - tests/corpus/instrument-control-manifest.json
      - tests/corpus/instrument-evaluation-plan.json
      - tests/instrument-control-corpus.test.mts
      - tests/instrument-evaluation-corpus-hydration.test.mts
      - tests/yamnet-candidate-capture.test.mts
      - tests/yamnet-comparator-eval.test.mts
      - tsconfig.instrument-evaluation.json
      - yamnet-comparator/**

concurrency:
  group: stem-splitter-yamnet-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-amd64-image:
    name: Pinned YAMNet comparator (native amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify the native runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = linux/x86_64
          test "$(node --version)" = v22.23.1
          test "$(python --version)" = "Python 3.12.13"
      - name: Run dependency-light comparator contracts
        run: python -m unittest discover -s yamnet-comparator -p 'test_*.py'
      - name: Run manifest, evaluator, and image-smoke contracts
        run: >-
          node --experimental-strip-types --test
          tests/corpus-manifest.test.mts
          tests/instrument-control-corpus.test.mts
          tests/instrument-evaluation-corpus-hydration.test.mts
          tests/yamnet-candidate-capture.test.mts
          tests/yamnet-comparator-eval.test.mts
      - name: Install the audio decoder
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Build the exact comparator source for linux/amd64
        env:
          DOCKER_BUILDKIT: "1"
        run: >-
          docker build --pull --platform linux/amd64
          --file yamnet-comparator/Dockerfile
          --tag stem-splitter-yamnet-comparator:ci .
      - name: Run constrained offline inference and rejection smoke
        env:
          YAMNET_COMPARATOR_EXPECTED_PLATFORM: linux/amd64
          YAMNET_COMPARATOR_MAX_IMAGE_BYTES: "805306368"
          YAMNET_COMPARATOR_SMOKE_TIMEOUT_MS: "60000"
        run: >-
          node --experimental-strip-types
          scripts/smoke-yamnet-comparator-image.mts
          stem-splitter-yamnet-comparator:ci
      - name: Hydrate the exact licensed evaluation audio
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/hydrate-instrument-evaluation-corpus.mts
          node --experimental-strip-types scripts/hydrate-instrument-controls.mts
      - name: Capture the full native observation set
        run: |
          set -euo pipefail
          install -d -m 700 output
          node --import tsx scripts/eval-yamnet-comparator.mts \
            --image stem-splitter-yamnet-comparator:ci \
            --output output/yamnet-native-amd64-corpus.json
          node --import tsx scripts/eval-yamnet-controls.mts \
            --image stem-splitter-yamnet-comparator:ci \
            --output output/yamnet-native-amd64-controls.json
          node --experimental-strip-types scripts/prepare-yamnet-candidate-source.mts \
            --corpus-report output/yamnet-native-amd64-corpus.json \
            --control-report output/yamnet-native-amd64-controls.json \
            --output output/yamnet-native-amd64-source-report.json
          node --experimental-strip-types scripts/capture-yamnet-instrument-candidate.mts \
            --source-report output/yamnet-native-amd64-source-report.json \
            --output output/yamnet-native-amd64-candidate.json
      - name: Upload native observation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yamnet-native-amd64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            output/yamnet-native-amd64-corpus.json
            output/yamnet-native-amd64-controls.json
            output/yamnet-native-amd64-source-report.json
            output/yamnet-native-amd64-candidate.json
          if-no-files-found: error
          retention-days: 30

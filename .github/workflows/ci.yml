name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run (image refreshes native evidence)
        type: choice
        options: [all, source, image]
        default: all

concurrency:
  group: stem-splitter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select general CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.changes.outputs.source }}
      image: ${{ steps.changes.outputs.image }}
      browsers: ${{ steps.changes.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - name: Select checks from changed files
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
          CI_SCOPE: ${{ inputs.scope }}
        run: node --experimental-strip-types .github/scripts/ci-changes.mjs

  source-gate:
    name: Source gate
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.source != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audio-pipeline manifest binds and verifies exact base and
          # candidate commits, so a single-commit checkout cannot satisfy it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --project local-separator --locked
      - name: Install FFmpeg test dependency
        run: bash .github/scripts/install-media-tools.sh ffmpeg
      - name: Verify instrument-discovery dependency lock
        run: uv lock --check --project instrument-discovery
      - name: Install Chrome for Playwright
        if: needs.changes.outputs.browsers != 'false'
        run: bash .github/scripts/install-media-tools.sh chrome
      - name: Run unit and Python tests
        run: bun run test
      - name: Validate ordered audio-pipeline promotion
        run: bun run check:audio-pipeline
      - name: Validate instrument evaluation and comparison boundaries
        run: >-
          bun run typecheck:instrument-evaluation &&
          bun run check:instrument-evaluation &&
          bun run compare:instrument-candidates
      - name: Run audio-analysis contract and parity tests
        run: bun run typecheck:analysis && bun run test:analysis-service
      - name: Run local browser E2E tests
        if: needs.changes.outputs.browsers != 'false'
        run: bun run test:e2e
      - name: Run server-authoritative Auto E2E tests
        if: needs.changes.outputs.browsers != 'false'
        run: bun run test:e2e:auto
      - name: Run teacher-isolation shadow E2E tests
        if: needs.changes.outputs.browsers != 'false'
        run: bun run test:e2e:isolation-shadow
      - name: Validate Wrangler bundle (no deployment)
        run: bun run wrangler -- deploy --dry-run --outdir "$RUNNER_TEMP/stem-splitter-wrangler-dry-run"

  analysis-image:
    name: Pinned analysis image (native amd64)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.image != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - name: Verify the native runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = linux/x86_64
          test "$(node --version)" = v22.23.1
      - name: Build current audio-analysis source
        env:
          DOCKER_BUILDKIT: "1"
        run: >-
          docker build --pull --platform linux/amd64
          --file audio-analysis/Dockerfile
          --tag stem-splitter-audio-analysis:ci .
      - name: Exercise the constrained analysis image
        env:
          AUDIO_ANALYSIS_EXPECTED_PLATFORM: linux/amd64
        run: ./scripts/smoke-audio-analysis-image.sh stem-splitter-audio-analysis:ci
      - name: Capture commit-bound native image evidence
        env:
          AUDIO_ANALYSIS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node --experimental-strip-types
          scripts/capture-audio-analysis-image-evidence.mts
          --image stem-splitter-audio-analysis:ci
          --output "$RUNNER_TEMP/audio-analysis-native-amd64-evidence.json"
      - name: Upload native image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-analysis-native-amd64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/audio-analysis-native-amd64-evidence.json
          if-no-files-found: error
          retention-days: 30

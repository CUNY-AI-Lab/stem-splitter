name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: stem-splitter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-gate:
    name: Source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --project local-separator --locked
      - name: Verify instrument-discovery dependency lock
        run: uv lock --check --project instrument-discovery
      - name: Install Chrome for Playwright
        run: bun run playwright -- install --with-deps chrome
      - name: Run unit and Python tests
        run: bun run test
      - name: Run audio-analysis contract and parity tests
        run: bun run typecheck:analysis && bun run test:analysis-service
      - name: Run local browser E2E tests
        run: bun run test:e2e
      - name: Run server-authoritative Auto E2E tests
        run: bun run test:e2e:auto
      - name: Run teacher-isolation shadow E2E tests
        run: bun run test:e2e:isolation-shadow
      - name: Validate Wrangler bundle (no deployment)
        run: bun run wrangler -- deploy --dry-run --outdir "$RUNNER_TEMP/stem-splitter-wrangler-dry-run"

  analysis-image:
    name: Pinned analysis image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build current audio-analysis source
        run: docker build --file audio-analysis/Dockerfile --tag stem-splitter-audio-analysis:ci .
      - name: Exercise the constrained analysis image
        env:
          AUDIO_ANALYSIS_EXPECTED_PLATFORM: linux/amd64
        run: ./scripts/smoke-audio-analysis-image.sh stem-splitter-audio-analysis:ci

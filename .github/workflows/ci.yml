name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: stem-splitter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-gate:
    name: Source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --project local-separator --locked
      - name: Verify instrument-discovery dependency lock
        run: uv lock --check --project instrument-discovery
      - name: Install Chrome for Playwright
        run: bun run playwright -- install --with-deps chrome
      - name: Run unit and Python tests
        run: bun run test
      - name: Run audio-analysis contract and parity tests
        run: bun run typecheck:analysis && bun run test:analysis-service
      - name: Run local browser E2E tests
        run: bun run test:e2e
      - name: Run server-authoritative Auto E2E tests
        run: bun run test:e2e:auto
      - name: Validate Wrangler bundle (no deployment)
        run: bun run wrangler -- deploy --dry-run --outdir "$RUNNER_TEMP/stem-splitter-wrangler-dry-run"

  analysis-image:
    name: Pinned analysis image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build current audio-analysis source
        run: docker build --file audio-analysis/Dockerfile --tag stem-splitter-audio-analysis:ci .
      - name: Verify runtime identity, surface, and size
        shell: bash
        run: |
          set -euo pipefail
          image=stem-splitter-audio-analysis:ci
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 'node'
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" = '["node","--max-old-space-size=256","dist/server.mjs"]'

          image_size="$(docker image inspect --format '{{.Size}}' "$image")"
          if (( image_size > 251658240 )); then
            printf 'audio-analysis image exceeds the 240 MiB gate: %s bytes\n' "$image_size" >&2
            exit 1
          fi

          docker run --rm "$image" node -e '
            const { readdirSync } = require("node:fs");
            if (process.getuid() === 0) throw new Error("runtime is root");
            const app = readdirSync("/app", { recursive: true }).sort();
            const expected = ["dist", "dist/server.mjs"];
            if (JSON.stringify(app) !== JSON.stringify(expected)) {
              throw new Error(`unexpected /app runtime surface: ${JSON.stringify(app)}`);
            }
          '
      - name: Verify the runtime decoder allowlist
        shell: bash
        run: |
          set -euo pipefail
          image=stem-splitter-audio-analysis:ci
          protocols="$(docker run --rm "$image" ffmpeg -hide_banner -protocols 2>&1)"
          enabled_protocols="$(
            printf '%s\n' "$protocols" |
              awk '/^  [[:alnum:]_]+$/ { print $1 }' |
              sort -u |
              paste -sd' ' -
          )"
          test "$enabled_protocols" = 'file pipe'

          demuxers="$(docker run --rm "$image" ffmpeg -hide_banner -demuxers 2>&1)"
          enabled_demuxers="$(
            printf '%s\n' "$demuxers" |
              awk '$1 == "D" { print $2 }' |
              sort |
              paste -sd' ' -
          )"
          test "$enabled_demuxers" = 'aiff flac mov,mp4,m4a,3gp,3g2,mj2 mp3 ogg wav'

          decoders="$(docker run --rm "$image" ffmpeg -hide_banner -decoders 2>&1)"
          if printf '%s\n' "$decoders" | awk '
            $1 == "------" { components = 1; next }
            components && $1 ~ /^[VS]/ { forbidden = 1 }
            END { exit forbidden ? 0 : 1 }
          '; then
            printf '%s\n' 'unexpected video or subtitle decoder in audio-analysis image' >&2
            exit 1
          fi

          decoded_bytes="$(
            docker run --rm \
              --volume "$PWD/tests/fixtures/audio/source.wav:/tmp/source.wav:ro" \
              "$image" \
              ffmpeg -v error -nostdin -i /tmp/source.wav -t 1 \
                -map 0:a:0 -vn -ac 1 -ar 22050 -acodec pcm_f32le -f f32le pipe:1 |
              wc -c |
              tr -d '[:space:]'
          )"
          test "$decoded_bytes" = '88200'
      - name: Verify readiness pins and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          container=stem-splitter-audio-analysis-ci
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18080:8080 \
            --env AUDIO_ANALYSIS_TOKEN=ci-only-analysis-token-0000000000000000 \
            --env AUDIO_ANALYSIS_SOURCE_ORIGINS=https://stem-splitter.invalid \
            stem-splitter-audio-analysis:ci

          ready_file="$RUNNER_TEMP/audio-analysis-ready.json"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >"$ready_file"; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep --quiet true; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          jq --exit-status \
            '.ready == true and .ffmpegVersion == "8.0.3" and .classifierVersion == "autosplit-role-v3"' \
            "$ready_file"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:18080/v1/analyze)" = 401

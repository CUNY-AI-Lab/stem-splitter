name: Cloudflare candidate checks

on:
  pull_request:
  push:
    branches: [codex/cloudflare-migration]

permissions:
  contents: read
  packages: read

concurrency:
  group: stem-cloudflare-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen application and adapter dependencies
        env:
          CAIL_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd cloudflare
          trap 'rm -f .npmrc' EXIT
          cat > .npmrc <<'NPMRC'
          @cuny-ai-lab:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${CAIL_PACKAGES_TOKEN}
          NPMRC
          bun install --frozen-lockfile
      - name: Verify private identity and Gateway boundaries in Workerd
        working-directory: cloudflare
        run: bun run typecheck && bun run test
      - name: Install Chrome
        run: bun run playwright -- install --with-deps chrome
      - name: Exercise recording, account and Listening Guide browser paths
        working-directory: cloudflare
        run: ../node_modules/.bin/playwright test --config playwright.config.mjs
      - name: Validate the isolated candidate bundle
        working-directory: cloudflare
        run: ./node_modules/.bin/wrangler deploy --config wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/stem-cloudflare"

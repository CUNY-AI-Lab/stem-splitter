name: YouTube extractor candidate image

on:
  pull_request:
    paths:
      - 'replicate-yt-audio/**'
      - 'scripts/lib/pin-check.mjs'
      - '.github/workflows/yt-audio-candidate.yml'
  push:
    branches: [codex/stem-reliability-20261006]
    paths:
      - 'replicate-yt-audio/**'
      - 'scripts/lib/pin-check.mjs'
      - '.github/workflows/yt-audio-candidate.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed extractor to r8.im/cali-thinkering/yt-audio
        type: boolean
        required: true
        default: false
      reviewed_commit:
        description: Exact 40-character workflow/source commit reviewed for publication
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'stem-youtube-publish-cali-thinkering-yt-audio' || format('stem-youtube-image-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  build:
    name: CPU extractor build and offline smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXTRACTOR_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate the selected source and explicit publication request
        env:
          PUBLISH_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXTRACTOR_SOURCE_COMMIT"
          if ! git diff --quiet HEAD --; then
            printf '%s\n' 'The checked-out source differs from the reviewed commit before the build.' >&2
            exit 1
          fi
          if [ "$PUBLISH_REQUEST" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = CUNY-AI-Lab/stem-splitter
            [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$REVIEWED_COMMIT" = "$EXTRACTOR_SOURCE_COMMIT"
            test "$REVIEWED_COMMIT" = "$GITHUB_SHA"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - name: Verify native runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = linux/x86_64
      - name: Run free extractor fixtures
        run: python3 -m unittest discover -s replicate-yt-audio -p 'test_*.py'
      - name: Install pinned Cog without registry authentication
        uses: replicate/setup-cog@8a5fea3c1818b6950dcf8027285f5a9b447c0c4a # v2
        with:
          cog-version: 'v0.23.0'
          token: ''
          install-cuda: false
      - name: Build CPU image locally on the runner
        working-directory: replicate-yt-audio
        run: cog build --progress plain -t "stem-youtube-candidate:${EXTRACTOR_SOURCE_COMMIT}"
      - name: Verify image dependencies, schema and setup without network access
        run: >-
          node replicate-yt-audio/verify-image.mjs
          "stem-youtube-candidate:${EXTRACTOR_SOURCE_COMMIT}"
          "$EXTRACTOR_SOURCE_COMMIT"
          "$RUNNER_TEMP/yt-audio-candidate-evidence.json"
      # Manual publication is the only step receiving the temporary CLI secret.
      # Cog reuses the runner's existing build cache; it still rebuilds final labels.
      - name: Publish the reviewed image to the fixed Replicate model
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'CUNY-AI-Lab/stem-splitter' }}
        timeout-minutes: 15
        working-directory: replicate-yt-audio
        env:
          STEM_YOUTUBE_CLI_TOKEN: ${{ secrets.STEM_YOUTUBE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$STEM_YOUTUBE_CLI_TOKEN" || { printf '%s\n' 'The temporary Stem YouTube CLI token is required.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXTRACTOR_SOURCE_COMMIT"
          # Cog rewrites .cog metadata; Python may refresh tracked bytecode.
          if ! git diff --quiet HEAD -- cog.yaml predict.py test_predict.py verify-image.mjs README.md ../scripts/lib/pin-check.mjs ../.github/workflows/yt-audio-candidate.yml; then
            printf '%s\n' 'Reviewed extractor source changed during the build; publication was not attempted.' >&2
            exit 1
          fi
          registry_config="$(mktemp -d "$RUNNER_TEMP/stem-youtube-registry.XXXXXX")"
          export DOCKER_CONFIG="$registry_config"
          trap 'unset STEM_YOUTUBE_CLI_TOKEN; rm -rf -- "$registry_config"' EXIT
          if ! printf '%s' "$STEM_YOUTUBE_CLI_TOKEN" | cog --no-color login --token-stdin >"$registry_config/login.log" 2>&1; then
            printf '%s\n' 'Replicate CLI sign-in failed; publication was not attempted.' >&2
            exit 1
          fi
          unset STEM_YOUTUBE_CLI_TOKEN
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/yt-audio-publication.json`, JSON.stringify({
            schemaVersion: 1, sourceCommit: process.env.EXTRACTOR_SOURCE_COMMIT,
            target: 'r8.im/cali-thinkering/yt-audio', publicationAttempted: true,
            outcome: 'unconfirmed', productionPinChanged: false, predictionCalls: 0,
          }, null, 2) + '\n');
          JS
          if ! cog --no-color push --json --progress plain r8.im/cali-thinkering/yt-audio >"$registry_config/push.json" 2>"$registry_config/push.log"; then
            printf '%s\n' 'Publication did not return a success receipt. Inspect the model before attempting another push.' >&2
            exit 1
          fi
          export STEM_PUSH_RECEIPT="$registry_config/push.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const raw = readFileSync(process.env.STEM_PUSH_RECEIPT);
          assert.ok(raw.length <= 16384, 'publication receipt exceeds its bound');
          const pushed = JSON.parse(raw);
          assert.deepEqual(Object.keys(pushed).sort(), ['image', 'version']);
          assert.equal(pushed.version, 1); // Cog JSON schema version, not a model-version ID.
          assert.match(pushed.image, /^r8\.im\/cali-thinkering\/yt-audio@sha256:[a-f0-9]{64}$/);
          const candidate = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/yt-audio-candidate-evidence.json`));
          assert.equal(candidate.sourceCommit, process.env.EXTRACTOR_SOURCE_COMMIT);
          writeFileSync(`${process.env.RUNNER_TEMP}/yt-audio-cog-push.json`, JSON.stringify(pushed, null, 2) + '\n');
          writeFileSync(`${process.env.RUNNER_TEMP}/yt-audio-publication.json`, JSON.stringify({
            schemaVersion: 1, sourceCommit: process.env.EXTRACTOR_SOURCE_COMMIT,
            target: 'r8.im/cali-thinkering/yt-audio', publicationAttempted: true, outcome: 'registry_push_confirmed',
            imageReference: pushed.image, registryDigest: pushed.image.split('@')[1],
            candidateImageId: candidate.imageId, replicateModelVersion: null,
            versionReadbackRequired: true, productionPinChanged: false, predictionCalls: 0,
          }, null, 2) + '\n');
          JS
          # Cog adds run.cog.push_id, so validate its final local image separately.
          docker tag r8.im/cali-thinkering/yt-audio:latest "stem-youtube-candidate:${EXTRACTOR_SOURCE_COMMIT}"
          node verify-image.mjs "stem-youtube-candidate:${EXTRACTOR_SOURCE_COMMIT}" "$EXTRACTOR_SOURCE_COMMIT" "$RUNNER_TEMP/yt-audio-published-image-evidence.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/yt-audio-publication.json`;
          const receipt = JSON.parse(readFileSync(path));
          const final = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/yt-audio-published-image-evidence.json`));
          const candidate = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/yt-audio-candidate-evidence.json`));
          assert.equal(final.sourceCommit, candidate.sourceCommit);
          assert.equal(final.schemaSha256, candidate.schemaSha256);
          assert.deepEqual(final.smoke, candidate.smoke);
          receipt.publishedImageId = final.imageId;
          receipt.publishedImageSmokePassed = true;
          writeFileSync(path, JSON.stringify(receipt, null, 2) + '\n');
          console.log(`Published ${receipt.imageReference}; model-version readback remains separate.`);
          JS
      - name: Preserve sanitized image and publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yt-audio-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/yt-audio-candidate-evidence.json
            ${{ runner.temp }}/yt-audio-cog-push.json
            ${{ runner.temp }}/yt-audio-publication.json
            ${{ runner.temp }}/yt-audio-published-image-evidence.json
          if-no-files-found: error
          retention-days: 30

name: EfficientAT comparator image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/efficientat-comparator-image.yml
      - audio-analysis/config.ts
      - audio-analysis/decoder.ts
      - audio-analysis/discovery.ts
      - audio-analysis/process.ts
      - docs/acceptance/2026-08-31-yamnet-native-amd64/evidence.json
      - efficientat-comparator/**
      - instrument-discovery/vocabulary.json
      - bun.lock
      - package.json
      - tsconfig.json
      - scripts/compare-instrument-classifiers.mts
      - scripts/eval-efficientat-comparator.mts
      - scripts/eval-efficientat-controls.mts
      - scripts/eval-instrument-discovery.mts
      - scripts/hydrate-instrument-controls.mts
      - scripts/hydrate-instrument-evaluation-corpus.mts
      - scripts/lib/instrument-control-corpus.mts
      - scripts/lib/instrument-evaluation.mts
      - scripts/run-efficientat-comparator-eval.sh
      - scripts/smoke-efficientat-comparator-image.mts
      - src/analysis/instrument-vocabulary.ts
      - src/analysis/types.ts
      - tests/corpus/corpus.json
      - tests/corpus/instrument-control-manifest.json
      - tests/corpus/instrument-discovery-expectations.json
      - tests/corpus/instrument-evaluation-corpus-hydration.json
      - tests/corpus/instrument-evaluation-plan.json
      - tests/efficientat-comparator-eval.test.mts
      - tests/instrument-control-corpus.test.mts
      - tests/instrument-evaluation-corpus-hydration.test.mts
      - tsconfig.instrument-evaluation.json
  pull_request:
    paths:
      - .github/workflows/efficientat-comparator-image.yml
      - audio-analysis/config.ts
      - audio-analysis/decoder.ts
      - audio-analysis/discovery.ts
      - audio-analysis/process.ts
      - docs/acceptance/2026-08-31-yamnet-native-amd64/evidence.json
      - efficientat-comparator/**
      - instrument-discovery/vocabulary.json
      - bun.lock
      - package.json
      - tsconfig.json
      - scripts/compare-instrument-classifiers.mts
      - scripts/eval-efficientat-comparator.mts
      - scripts/eval-efficientat-controls.mts
      - scripts/eval-instrument-discovery.mts
      - scripts/hydrate-instrument-controls.mts
      - scripts/hydrate-instrument-evaluation-corpus.mts
      - scripts/lib/instrument-control-corpus.mts
      - scripts/lib/instrument-evaluation.mts
      - scripts/run-efficientat-comparator-eval.sh
      - scripts/smoke-efficientat-comparator-image.mts
      - src/analysis/instrument-vocabulary.ts
      - src/analysis/types.ts
      - tests/corpus/corpus.json
      - tests/corpus/instrument-control-manifest.json
      - tests/corpus/instrument-discovery-expectations.json
      - tests/corpus/instrument-evaluation-corpus-hydration.json
      - tests/corpus/instrument-evaluation-plan.json
      - tests/efficientat-comparator-eval.test.mts
      - tests/instrument-control-corpus.test.mts
      - tests/instrument-evaluation-corpus-hydration.test.mts
      - tsconfig.instrument-evaluation.json

concurrency:
  group: stem-splitter-efficientat-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-amd64-image:
    name: Pinned EfficientAT comparator (native amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v7.1.4
        with:
          version: "0.11.32"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify the native runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = linux/x86_64
          test "$(node --version)" = v22.23.1
          test "$(python --version)" = "Python 3.12.13"
          uv --version | grep -Eq '^uv 0\.11\.32( |$)'
      - name: Verify the dependency lock and comparator contracts
        run: |
          uv lock --check --project efficientat-comparator
          PYTHONPATH=efficientat-comparator \
            python -m unittest efficientat-comparator/test_contract.py
      - name: Run evaluator and corpus contracts
        run: >-
          node --experimental-strip-types --test
          tests/corpus-manifest.test.mts
          tests/instrument-control-corpus.test.mts
          tests/instrument-evaluation-corpus-hydration.test.mts
          tests/efficientat-comparator-eval.test.mts
      - name: Install the audio decoder
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Build the exact comparator source for linux/amd64
        env:
          DOCKER_BUILDKIT: "1"
        run: >-
          docker build --pull --platform linux/amd64
          --file efficientat-comparator/Dockerfile
          --tag stem-splitter-efficientat-comparator:ci .
      - name: Run constrained offline inference and rejection smoke
        env:
          EFFICIENTAT_COMPARATOR_EXPECTED_PLATFORM: linux/amd64
          EFFICIENTAT_COMPARATOR_MAX_IMAGE_BYTES: "1342177280"
          EFFICIENTAT_COMPARATOR_SMOKE_TIMEOUT_MS: "120000"
        run: >-
          node --experimental-strip-types
          scripts/smoke-efficientat-comparator-image.mts
          stem-splitter-efficientat-comparator:ci
      - name: Hydrate the exact licensed evaluation audio
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/hydrate-instrument-evaluation-corpus.mts
          node --experimental-strip-types scripts/hydrate-instrument-controls.mts
      - name: Capture the native observation and abstention set
        run: |
          set -euo pipefail
          install -d -m 700 output
          node --import tsx scripts/eval-efficientat-comparator.mts \
            --image stem-splitter-efficientat-comparator:ci \
            --output output/efficientat-native-amd64-corpus.json
          node --import tsx scripts/eval-efficientat-controls.mts \
            --image stem-splitter-efficientat-comparator:ci \
            --output output/efficientat-native-amd64-controls.json
          node --experimental-strip-types scripts/compare-instrument-classifiers.mts \
            --efficientat-corpus output/efficientat-native-amd64-corpus.json \
            --efficientat-controls output/efficientat-native-amd64-controls.json \
            --output output/instrument-classifier-comparison.json
      - name: Upload native comparison evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: efficientat-native-amd64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            output/efficientat-native-amd64-corpus.json
            output/efficientat-native-amd64-controls.json
            output/instrument-classifier-comparison.json
          if-no-files-found: error
          retention-days: 30

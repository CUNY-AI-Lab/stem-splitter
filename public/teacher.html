<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Stem Splitter · Instructor</title>
<link rel="stylesheet" href="/styles.css?v=teacher-20260817-4" />

<div class="grain" aria-hidden="true"></div>

<main class="teacher-main">
  <header class="masthead">
    <h1 id="class-guidance-title">CLASS<br /><span>GUIDANCE</span></h1>
  </header>

  <section id="signin-panel" class="deck teacher-panel" hidden>
    <form id="signin-form" class="teacher-form">
      <h2 class="rack-title"><span>SIGN IN</span></h2>
      <label class="teacher-field">
        <span class="mono">USERNAME</span>
        <input id="signin-username" name="username" autocomplete="username" required />
      </label>
      <label class="teacher-field">
        <span class="mono">PASSWORD</span>
        <input id="signin-password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="yt-go teacher-submit">SIGN IN</button>
      <p id="signin-error" class="mono teacher-error" hidden></p>
    </form>
  </section>

  <section id="console-panel" class="teacher-panel" hidden>
    <div class="teacher-bar">
      <span id="teacher-who" class="mono"></span>
      <button type="button" id="signout" class="crate-page-btn">SIGN OUT</button>
    </div>

    <section class="teacher-prompt-section teacher-amendment-section" aria-labelledby="class-guidance-title">
      <span id="effective-prompt-meta" hidden></span>

      <form id="prompt-form" class="teacher-form">
        <label class="teacher-field" for="amendment">
          <span class="sr-only">Class guidance</span>
          <textarea
            id="amendment"
            class="teacher-textarea"
            rows="5"
          ></textarea>
        </label>
        <label class="teacher-field" for="change-note">
          <span class="mono">CHANGE NOTE</span>
          <input
            id="change-note"
            maxlength="240"
          />
        </label>
        <div class="teacher-bar teacher-edit-meta">
          <span id="amendment-count" class="mono"></span>
          <span id="change-note-count" class="mono"></span>
          <span id="amendment-meta" class="mono"></span>
        </div>
        <div class="teacher-actions">
          <button type="submit" class="yt-go">SAVE</button>
          <button type="button" id="preview-btn" class="crate-page-btn">PREVIEW</button>
        </div>
        <p id="prompt-status" class="mono teacher-status" hidden></p>
      </form>
    </section>

    <details id="preview-wrap" class="teacher-preview" hidden>
      <summary class="mono">Prompt preview</summary>
      <article id="preview-body" class="teacher-markdown teacher-effective-preview"></article>
    </details>

    <section class="teacher-more-tools" aria-labelledby="teacher-more-tools-title">
      <h2 id="teacher-more-tools-title">More</h2>

      <details id="fixed-prompt-details" class="teacher-tool">
        <summary id="fixed-prompt-title">
          <strong>System prompt</strong>
          <span id="fixed-prompt-meta" hidden></span>
        </summary>
        <section class="teacher-tool-body" aria-labelledby="fixed-prompt-title">
          <div
            id="fixed-prompt-scroll"
            class="teacher-fixed-scroll"
            tabindex="0"
            aria-label="System prompt, read only"
          >
            <article id="fixed-prompt-body" class="teacher-markdown"></article>
          </div>
          <button
            type="button"
            id="fixed-prompt-toggle"
            class="teacher-caret-control mono"
            aria-controls="fixed-prompt-scroll"
            aria-expanded="false"
          >
            <span class="teacher-up-caret" aria-hidden="true">↑</span>
            <span id="fixed-prompt-toggle-label">TOP</span>
          </button>
        </section>
      </details>

      <details class="teacher-tool">
        <summary id="prompt-history-title">
          <strong>History</strong>
        </summary>
        <section class="teacher-tool-body teacher-history" aria-labelledby="prompt-history-title">
          <p id="prompt-history-empty" class="teacher-help">No revisions yet.</p>
          <ol id="prompt-history" class="teacher-history-list"></ol>
          <button type="button" id="prompt-history-more" class="crate-page-btn" hidden>
            LOAD EARLIER REVISIONS
          </button>
        </section>
      </details>

    </section>
  </section>

  <footer>
    <p><a href="/">&larr; back to the mixer</a></p>
  </footer>
</main>

<script src="/teacher.js?v=teacher-20260817-4"></script>
